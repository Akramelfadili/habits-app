# Known bug (a): Today — tap a previous day in the week strip, then scroll and
# slide on the empty area. The strip hides, then reappears.
# route: /?fixtures=today-v3 · clock: 2026-10-23T09:00:00 (Friday 23 October)
# Driven by scripts/device-validation/record-flows.mjs, which opens the state,
# records video and keeps these screenshots. Steps are optional so a missing
# label still leaves a video of how far the flow got.
appId: ${BUNDLE_ID}
---
- extendedWaitUntil:
    visible: ".*Drink water.*"
    timeout: 20000
- takeScreenshot: a-01-today
# The strip's other days are not in the accessibility tree (see the run notes), so tap by position.
- tapOn: {point: "37%, 21%"}
- extendedWaitUntil:
    visible: "Logging for Wed 21 Oct.*"
    timeout: 8000
    optional: true
- takeScreenshot: a-02-past-day-selected
# Scroll and slide on the list: down, back up, a slow drag, a flick.
- swipe: {start: "50%, 80%", end: "50%, 40%", duration: 600}
- takeScreenshot: a-03-after-scroll-down
- swipe: {start: "50%, 40%", end: "50%, 80%", duration: 600}
- takeScreenshot: a-04-after-scroll-up
- swipe: {start: "50%, 85%", end: "50%, 20%", duration: 1800}
- takeScreenshot: a-05-after-slow-drag
- swipe: {start: "50%, 20%", end: "50%, 85%", duration: 1800}
- takeScreenshot: a-06-after-slow-drag-back
- swipe: {start: "50%, 70%", end: "50%, 30%", duration: 120}
- extendedWaitUntil: {visible: "__never_on_screen__", timeout: 1200, optional: true}
- takeScreenshot: a-07-after-flick
- swipe: {start: "50%, 30%", end: "50%, 75%", duration: 120}
- extendedWaitUntil: {visible: "__never_on_screen__", timeout: 1200, optional: true}
- takeScreenshot: a-08-after-flick-back
# Is the strip there and tappable again?
- assertVisible:
    text: ".*Today, Friday 23.*"
    optional: true
- takeScreenshot: a-09-strip-check
