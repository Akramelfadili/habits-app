# Journey: Habits tab → Categories → add a custom category → open a habit's Edit
# and assign it → Today groups the habit under the new category.
# UNVERIFIED: written without a run (no Maestro session in the authoring
# environment); selectors are taken from the source strings. Confirm and drop this
# line at the next simulator pass (docs/how-to/e2e.md § "Status and coverage").
#
# Seed (`categories-in-use` fixtures, clock pinned to Thu 1 Oct): the ten
# built-ins and three custom categories (Music, Language, Garden); Stretch is a
# daily Fitness habit.
url: ${APP_URL}/?fixtures=categories-in-use&clock=2026-10-01T09:00:00
env:
  APP_URL: http://localhost:8081
tags:
  - journey
---
- launchApp
- assertVisible: "Thursday, 1 October"

- tapOn:
    id: "Habits"
- tapOn:
    id: "Categories, .*"
- assertVisible: "Custom · 3"

- tapOn:
    id: "Add category"
- assertVisible: "New category"
- assertVisible: "Icon and colour are picked for you from those not in use."
- tapOn:
    id: "Name"
- inputText: "Journaling"
# The header's Add category and the sheet's button share a label: the sheet's is the second.
- tapOn:
    text: "Add category"
    index: 1
- assertVisible: "Custom · 4"
- assertVisible: "Journaling"
- takeScreenshot: hab-24-42-added

# The new category is one of the form's chips. Stretch opens from Today
# (the library's rows are swipeable, which the web driver cannot tap).
- back
- tapOn:
    id: "Today"
- tapOn: "Stretch"
- tapOn: "Edit"
- assertVisible: "Edit habit"
- tapOn: "Journaling"
- tapOn: "Save changes"
- assertVisible: "Streak"

- back
- assertVisible: "Journaling"
- assertVisible: "Stretch"
- takeScreenshot: hab-24-42-assigned
