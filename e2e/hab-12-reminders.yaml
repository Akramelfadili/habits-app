# Journey: Today → Habit Detail → Reminders (empty state) → Add time → change
# its days (triggering the unscheduled-day warning) → remove it with Undo →
# back on Detail the summary reflects it, and Today is unaffected.
# Covers HAB-09 (entry point), HAB-43 (reminders: R1 empty, R2 times, R3
# remove with Undo), HAB-27 (Reminders is a shared route, pushed inside the
# tab it was opened from).
#
# MANUAL-ONLY: whether the OS notification actually fires at 09:00 on the
# right days can't be checked here — web stubs expo-notifications, and even
# on a simulator Maestro can't wait for or inspect a delivered notification.
# Verify on a real device (dev-client build): set a reminder 1–2 min ahead,
# lock the phone, confirm it arrives; switch it off and confirm it doesn't.
# See e2e/README.md.
#
# Seed (default fixtures, clock pinned to Thu 1 Oct): "Evening walk" is
# scheduled Mon–Fri and has no reminders.
url: ${APP_URL}/?clock=2026-10-01T09:00:00
env:
  APP_URL: http://localhost:8081
tags:
  - journey
---
- launchApp
- tapOn: "Evening walk"
- assertVisible: "None"
# The row's value: "Reminders" would match the section label above it.
- tapOn: "None"

# R1: nothing yet, one clear action.
- assertVisible: "No reminders yet"
- tapOn: "Add time"
# The sheet opens on 09:00 on the habit's own days. (Web's time wheel is a
# static read-out, so the time itself isn't changed here.)
- assertVisible: "Save time"
- tapOn: "Save time"
- assertVisible:
    id: "09:00, Weekdays"

# R2: tap the time to change its days. A day the habit isn't scheduled on is
# flagged; the reminder is never fired for it.
- tapOn:
    id: "09:00, Weekdays"
- tapOn:
    id: "Saturday"
- tapOn: "Save time"
- assertVisible:
    id: "09:00, Mon, Tue, Wed, Thu, Fri, Sat"
- assertVisible: "09:00: Saturday is not a scheduled day for this habit — this reminder would fire for nothing."
- takeScreenshot: hab-12-unscheduled-warning

# R3: remove is instant, with an Undo that brings back the same time.
- tapOn:
    id: "Remove reminder at 09:00"
- assertVisible: "Reminder at 09:00 removed"
- assertVisible: "No reminders yet"
- tapOn: "Undo"
- assertVisible:
    id: "09:00, Mon, Tue, Wed, Thu, Fri, Sat"
- takeScreenshot: hab-12-after-undo

# Detail summarises the reminder.
- back
- assertVisible: "09:00 · Mon, Tue, Wed, Thu, Fri, Sat"

# Reminders never gate Today. Both screens were pushed inside the Today tab,
# so Back walks straight back out to it (HAB-27).
- back
- assertVisible: "Today"
- assertVisible: "Evening walk"
