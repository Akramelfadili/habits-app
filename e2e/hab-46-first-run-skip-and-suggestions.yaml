# Journey: first run → skip to an empty Today → Browse suggestions → pick one → it opens
# Add habit filled in → save → the suggestion reads Added → Today has the habit.
url: ${APP_URL}/?fixtures=first-run&clock=2026-10-01T09:00:00
env:
  APP_URL: http://localhost:8081
tags:
  - journey
---
- launchApp

# No tab bar. Skip for now is the way out to an empty Today, which has the bar.
- assertVisible: "Small habits,.*"
- assertNotVisible:
    id: "Habits"
- tapOn: "Skip for now"
- assertVisible: "Nothing to track yet"
- assertVisible:
    id: "Habits"

- tapOn: "Browse suggestions"
- assertVisible: "Tap one to open Add habit with it filled in. Change anything before saving."
- tapOn: "Meditate"
- assertVisible: "From a suggestion"
- assertVisible: "Meditate is filled in. Change anything before saving."
- tapOn: "Save habit"

- assertVisible: "Added"
- tapOn: "Close"

- assertVisible: "Meditate"
- assertVisible: "Mindfulness"
- assertNotVisible: "Nothing to track yet"
- assertVisible:
    id: "Habits"

# First Run never returns: nothing in the app reopens it.
- tapOn:
    id: "Habits"
- assertVisible: "1 active"
