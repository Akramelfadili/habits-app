# Journey: first run → pick suggestions → add a habit of my own → log it on Today.
# Covers HAB-06 (first run), HAB-01/02 (create + frequency, edit from Detail), HAB-03 (Today completion).
url: ${APP_URL}/?fixtures=first-run&clock=2026-10-01T09:00:00
env:
  APP_URL: http://localhost:8081
tags:
  - journey
---
- launchApp

# HAB-06: two suggestions pre-selected; toggling one updates the count live.
- assertVisible: "Add 2 habits"
- tapOn: "Stretch"
- assertVisible: "Add 3 habits"
- tapOn: "Add 3 habits"

# Lands on Today with the three suggestions, none done yet.
- assertVisible: "Thursday, 1 October"
- assertVisible: "Glass of water"
- assertVisible: "Walk 20 minutes"
- assertVisible: "Stretch"
# …created as their subtitles promised: grouped by category (Glass of water
# under Health, Walk and Stretch under Fitness), and Stretch as a 5-minute
# quantity habit, which its status line says ("0 of 5 min").
- assertVisible: "Health"
- assertVisible: "Fitness"
- assertVisible: "0 of 5 min"

# HAB-01: add a habit of my own, from the + in Today's header (HAB-27 — the
# ⋯ menu is gone and the + is an icon button, so it matches by label).
# The collapsed inline bar carries a second, inert +: take the header's.
- tapOn:
    id: "Add habit"
    index: 1
- assertVisible: "New habit"
# HAB-41: only the name is required — Save says so until one is typed, and a
# habit without a category goes to Other.
- assertVisible: "Add a name to save"
- tapOn:
    id: "Name"
- inputText: "Floss"
- assertNotVisible: "Add a name to save"
- tapOn: "Save habit"

# HAB-03: it shows on Today and can be ticked off.
- assertVisible: "Floss"
- tapOn:
    id: "Floss, not done"
- assertVisible:
    id: "Floss, done"
- assertVisible: "Marked 'Floss' complete"
- takeScreenshot: hab-06-01-03-logged

# HAB-01: the habit can be edited later from its Detail header.
- tapOn: "Floss"
- tapOn: "Edit"
- assertVisible: "Edit habit"
# With an edit, Close asks first (F9): Keep editing stays, Discard leaves.
- tapOn:
    id: "Name"
- inputText: "s"
- tapOn: "Close"
- assertVisible: "Discard changes?"
- tapOn: "Keep editing"
- assertVisible: "Edit habit"
- tapOn: "Close"
- tapOn: "Discard"
- assertVisible: "Streak"

# HAB-27: Detail opened from Today, so the Today tab is still the selected
# one and Back comes back to it.
- assertVisible:
    id: "Today"
- back
- assertVisible: "Today"
- assertVisible: "Floss"
