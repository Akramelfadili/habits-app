# Journey: first run → quick-pick a first habit → add a habit of my own → log it on Today.
url: ${APP_URL}/?fixtures=first-run&clock=2026-10-01T09:00:00
env:
  APP_URL: http://localhost:8081
tags:
  - journey
---
- launchApp

# First Run opens instead of Today, with no tab bar.
- assertVisible: "Small habits,.*"
- assertNotVisible:
    id: "Progress"
- tapOn: "Add your first habit"
- assertVisible: "Your first habit"
- assertVisible: "Add a name to save"
- tapOn: "Drink water"
- assertNotVisible: "Add a name to save"
- tapOn: "Save habit"

# Our own question comes before iOS gets to ask; Not now asks nothing.
- assertVisible: "Remind you each day?"
- tapOn: "Not now"

- assertVisible: "Thursday, 1 October"
- assertVisible: "Drink water"
- assertVisible: "Health"
- assertVisible: "0 of 8 glasses"
- assertVisible:
    id: "Progress"

# Add a habit of my own from the + in Today's header (an icon button, so it matches by label).
# The collapsed inline bar carries a second, inert +: take the header's.
- tapOn:
    id: "Add habit"
    index: 1
- assertVisible: "New habit"
# Only the name is required: Save says so until one is typed, and a habit without a category goes to Other.
- assertVisible: "Add a name to save"
- tapOn:
    id: "Name"
- inputText: "Floss"
- assertNotVisible: "Add a name to save"
- tapOn: "Save habit"

- assertVisible: "Floss"
- tapOn:
    id: "Floss, not done"
- assertVisible:
    id: "Floss, done"
- assertVisible: "Marked 'Floss' complete"
- takeScreenshot: hab-06-01-03-logged

- tapOn: "Floss"
- tapOn: "Edit"
- assertVisible: "Edit habit"
# With an edit, Close asks first: Keep editing stays, Discard leaves.
- tapOn:
    id: "Name"
- inputText: "s"
- tapOn: "Close"
- assertVisible: "Discard changes?"
- tapOn: "Keep editing"
- assertVisible: "Edit habit"
- tapOn: "Close"
- tapOn: "Discard"
- assertVisible: "Streak"

# Detail opened from Today, so the Today tab is still the selected one and Back comes back to it.
- assertVisible:
    id: "Today"
- back
- assertVisible: "Today"
- assertVisible: "Floss"
