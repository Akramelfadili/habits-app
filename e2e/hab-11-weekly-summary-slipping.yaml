# Journey: Weekly Summary flags the worst habit → backfill the week so a
# different habit falls behind → the insight moves to it → "Reschedule
# habit" opens that habit's Edit screen.
# Covers HAB-11 (summary + slipping insight), HAB-10 (retro-log as the way
# to log past days), HAB-02 (Edit/reschedule as the insight's destination),
# HAB-27 (the summary is the Progress tab root; switching tabs keeps each
# tab's own stack).
#
# Seed (default fixtures, clock pinned to Thu 1 Oct 20:00): four habits,
# nothing logged Mon–Wed; today Read before bed and Glass of water are done.
# So before logging, Evening walk (0 of 3) is the worst habit. Backfilling
# Mon–Wed for everything except Read before bed leaves Read as the only one
# behind (1 of 4; today's still-open habits don't count against the week yet) — the insight needs ≥3 scheduled days, which is why the
# clock is pinned to Thursday rather than left on the real weekday.
url: ${APP_URL}/?clock=2026-10-01T20:00:00
env:
  APP_URL: http://localhost:8081
tags:
  - journey
---
- launchApp

# HAB-27: the weekly summary is the Progress tab's root — no ⋯ menu.
- tapOn:
    id: "Progress"
- assertVisible: "Your week"
- assertVisible: "Evening walk is slipping"
- takeScreenshot: hab-11-before
- tapOn:
    id: "Today"
- assertVisible: "Today"

# Backfill Mon–Wed from a habit's heatmap: one Edit this day sheet per day lists
# every habit due that day, so several can be ticked at once.
- tapOn: "Glass of water"
- tapOn:
    id: "Monday 28 September, missed"
- tapOn:
    id: "Glass of water, not done"
- tapOn:
    id: "Evening walk, not done"
- tapOn:
    id: "No phone after 23:00, resisted[?]"
- tapOn: "Done"
- tapOn:
    id: "Tuesday 29 September, missed"
- tapOn:
    id: "Glass of water, not done"
- tapOn:
    id: "Evening walk, not done"
- tapOn:
    id: "No phone after 23:00, resisted[?]"
- tapOn: "Done"
- tapOn:
    id: "Wednesday 30 September, missed"
- tapOn:
    id: "Glass of water, not done"
- tapOn:
    id: "Evening walk, not done"
- tapOn:
    id: "No phone after 23:00, resisted[?]"
- tapOn: "Done"
- assertVisible:
    id: "Wednesday 30 September, logged"
# Detail was opened from Today, so Back returns there, not to Progress.
- back
- assertVisible: "Today"

- tapOn:
    id: "Progress"
- assertVisible: "Read before bed is slipping"
- assertNotVisible: "Evening walk is slipping"
- takeScreenshot: hab-11-after

# The insight's link opens that habit's Edit screen to reschedule it.
- tapOn: "Reschedule habit →"
- assertVisible: "Edit habit"
- assertVisible: "Save habit"
- assertVisible: "20"
- takeScreenshot: hab-11-edit
