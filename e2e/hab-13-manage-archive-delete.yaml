# Journey: give a habit a reminder → Manage habits → reorder within a
# category → archive the habit with the reminder → its history and reminder
# survive → restore it → delete a different habit through Detail's confirm
# sheet → Today reflects all of it.
# Covers HAB-13 (reorder, archive, restore, delete), HAB-12 (reminders kept
# across archive), HAB-09 (Detail as the only place delete lives), HAB-03,
# HAB-27 (the Habits tab root, and Settings behind its gear).
#
# Seed (`manage-archive` fixtures, clock pinned to Thu 1 Oct): active Glass of
# water + Meditate (Morning), Read (Evening), Easy run + Mobility (Training);
# archived Cold shower and No phone in bed.
#
# Drag-to-reorder and swipe-to-archive are gesture-handler pans. Maestro's web
# driver moves the pointer in a single jump, which never activates them (a
# stepped drag in Playwright does — the gestures themselves work on web), so:
#   - iOS: reorders by dragging the grip and archives by swiping the row.
#     UNVERIFIED until the flows run against a dev-client build — see README.
#   - Web: skips the reorder and archives through the other real path,
#     Detail's one-tap "Archive habit". The reorder's persistence is
#     covered by reorderable-list / habit-repository unit tests, and its lifted
#     mid-drag state by `npm run visual-check -- manage-habits-dragging`.
#     An *active* row on Manage is wrapped in SwipeableRow, and the web
#     driver's single-jump tap never reaches the row underneath it, so the
#     web branch opens each active habit's Detail from Today instead (those
#     rows are plain). Archived rows are plain on Manage and tap fine.
url: ${APP_URL}/?fixtures=manage-archive&clock=2026-10-01T09:00:00
env:
  APP_URL: http://localhost:8081
tags:
  - journey
---
- launchApp

# Give Meditate an active reminder first.
- tapOn: "Meditate"
- tapOn: "Reminders"
- tapOn:
    id: "Add a time, 0 of 4"
- tapOn: "Save time"
- assertVisible:
    id: "Reminder at 09:00, Every day"
- back
- assertVisible: "1 on · 09:00"
- back

# HAB-27: Manage & archive is the Habits tab's root — no ⋯ menu.
- tapOn:
    id: "Habits"
- assertVisible: "Archived · 2"
# The screen's title is "Habits", the same word as the tab, so it isn't
# asserted on its own; the footnote identifies the screen.
- assertVisible: "Order is set per category and matches Today. To move a habit to another category, edit it."
# No destructive action on this screen.
- assertNotVisible: "Delete habit"

# HAB-27 / D3: the gear in the Habits header is the only way into Settings.
- tapOn:
    id: "Settings"
- assertVisible: "Appearance"
- takeScreenshot: hab-13-settings
# Settings was pushed inside the Habits tab, so Back returns to Manage.
- back
- assertVisible: "Order is set per category and matches Today. To move a habit to another category, edit it."

- runFlow:
    when:
      platform: iOS
    commands:
      # Reorder: drag Meditate's grip above Glass of water (same Morning group).
      - assertVisible:
          text: "Meditate"
          below: "Glass of water"
      - swipe:
          from:
            text: "Reorder Meditate"
          direction: UP
          duration: 1500
      - assertVisible:
          text: "Glass of water"
          below: "Meditate"
      # Archive: swipe the row left and tap the revealed action.
      - swipe:
          from:
            text: "Meditate"
          direction: LEFT
      - tapOn: "Archive"
      - assertVisible: "Archived 'Meditate'"

- runFlow:
    when:
      platform: Web
    commands:
      # Detail from Today (Manage's active rows are swipeable, see above).
      # One tap, no confirmation; the toast offers the Undo.
      - tapOn:
          id: "Today"
      - tapOn: "Meditate"
      - tapOn: "Archive habit"
      - assertVisible: "Archived 'Meditate'"
      - tapOn:
          id: "Habits"

- assertVisible: "Archived · 3"
- takeScreenshot: hab-13-archived

# Archiving is non-destructive, but reminders pause with the habit (HAB-20),
# and an archived habit isn't offered Archive again. Archived rows are plain,
# so this one opens straight from Manage.
- tapOn: "Meditate"
- assertVisible: "Paused while archived"
- assertNotVisible: "Archive habit"
- back

# Restore it — archived rows are newest first, so Meditate's Restore is the first.
- tapOn:
    text: "Restore"
    index: 0
- assertVisible: "Restored 'Meditate' — back on Today"
- assertVisible: "Archived · 2"

# The reminder came back with it, unpaused and unchanged.
- tapOn:
    id: "Today"
- tapOn: "Meditate"
- assertVisible: "1 on · 09:00"
- back

# Delete a different habit — only offered on its Detail, behind a confirm
# sheet. Mobility is active (Mon–Fri, and the clock is a Thursday), so its
# Detail opens from Today.
- tapOn:
    id: "Today"
- tapOn: "Mobility"
- tapOn: "Delete habit"
- assertVisible: "Keep habit"
- takeScreenshot: hab-13-delete-confirm
- tapOn: "Delete permanently"
- assertVisible: "Deleted 'Mobility'"
- assertNotVisible: "Mobility"

# Today: restored Meditate is back; Mobility is gone. Delete pops Detail
# back to the tab it was opened from, which is already Today.
- assertVisible: "Today"
- assertVisible: "Meditate"
- assertNotVisible: "Mobility"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          text: "Glass of water"
          below: "Meditate"
- takeScreenshot: hab-13-today
