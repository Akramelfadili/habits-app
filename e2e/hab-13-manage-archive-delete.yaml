# Journey: give a habit a reminder → the Habits tab → Settings and back →
# archive the habit with the reminder from its Detail → it moves under
# Archived, its history and reminder survive → Restore it (instant, with an
# Undo toast) → delete a different habit through Detail's confirm sheet →
# Today reflects all of it.
# Covers HAB-13 (archive, restore, delete), HAB-12 (reminders kept across
# archive), HAB-09 (Detail as the only place delete lives), HAB-03,
# HAB-27 (the Habits tab root, and Settings behind its gear), HAB-39/40/45.
#
# Seed (`manage-archive` fixtures, clock pinned to Thu 1 Oct): active Glass of
# water + Meditate + Read (Morning), Easy run + Mobility + Upper body (Training);
# archived Cold shower and No phone in bed.
#
# Drag-to-reorder is a gesture-handler pan; Maestro's web driver moves the
# pointer in a single jump, which never activates it (a stepped drag in
# Playwright does), so the reorder is not driven here. Its persistence is
# covered by reorderable-list / habit-repository unit tests and its lifted
# mid-drag state by the visual-check state `habits-reorder`. Archive goes
# through Detail's Archive habit sheet (DC5), the same on every platform.
url: ${APP_URL}/?fixtures=manage-archive&clock=2026-10-01T09:00:00
env:
  APP_URL: http://localhost:8081
tags:
  - journey
---
- launchApp

# Give Meditate an active reminder first.
- tapOn: "Meditate"
# The row's value: "Reminders" would match the section label above it.
- tapOn: "None"
- tapOn:
    id: "Add a time, 0 of 4"
- tapOn: "Save time"
- assertVisible:
    id: "Reminder at 09:00, Every day"
- back
- assertVisible: "09:00 · daily"
- back

# HAB-27: the Habits tab's root is the library; counts are its eyebrow.
- tapOn:
    id: "Habits"
- assertVisible: "6 active · 2 archived"
- assertVisible: "Meditate"
# Archived is collapsed until opened (H1); no destructive action in the list.
- assertNotVisible: "Cold shower"
- assertNotVisible: "Delete habit"

# HAB-27 / D3: the gear in the Habits header is the only way into Settings.
# The collapsed inline bar carries a second, inert gear: take the header's.
- tapOn:
    id: "Settings"
    index: 1
- assertVisible: "Appearance"
- takeScreenshot: hab-13-settings
# Settings was pushed inside the Habits tab, so Back returns to the library.
- back
- assertVisible: "6 active · 2 archived"

# Archive Meditate from its Detail (DC5): one confirm, then it pops back with
# an Undo toast. Web's single-jump tap lands one library row low (it opened
# Read), so the Detail opens from Today's plain row instead.
- tapOn:
    id: "Today"
- tapOn: "Meditate"
- tapOn: "Archive habit"
# The sheet's button shares the row's label; it is the second match.
- tapOn:
    text: "Archive habit"
    index: 1
- assertVisible: "Meditate archived"
- tapOn:
    id: "Habits"
- assertVisible: "5 active · 3 archived"
- takeScreenshot: hab-13-archived

# Open the Archived section; the row carries the date it left Today.
- tapOn: "Show"
- assertVisible: "Cold shower"
- assertVisible: "Meditate"

# Archiving is non-destructive, but reminders pause with the habit (HAB-20),
# and an archived habit isn't offered Archive again.
- tapOn: "Meditate"
- assertVisible: "Archived on .*"
- assertVisible: "Paused"
- assertNotVisible: "Archive habit"
- back

# Restore it (instant, toast with Undo).
# Archived rows are newest first, so Meditate's Restore is the first.
- tapOn:
    text: "Restore"
    index: 0
- assertVisible: "Meditate is back on Today"
- assertVisible: "6 active · 2 archived"

# The reminder came back with it, unpaused and unchanged.
- tapOn:
    id: "Today"
- tapOn: "Meditate"
- assertVisible: "09:00 · daily"
- back

# Delete a different habit — only offered on its Detail, behind a confirm
# sheet. Mobility is active (Mon–Fri, and the clock is a Thursday), so its
# Detail opens from Today.
- tapOn: "Mobility"
- tapOn: "Delete habit"
- assertVisible: "Archive instead"
- takeScreenshot: hab-13-delete-confirm
- tapOn: "Delete permanently"
- assertVisible: "Mobility deleted"
- assertNotVisible: "Mobility, not done"

# Today: restored Meditate is back; Mobility is gone. Delete pops Detail
# back to the tab it was opened from, which is already Today.
- assertVisible: "Meditate"
- takeScreenshot: hab-13-today
