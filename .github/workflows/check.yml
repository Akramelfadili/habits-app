# The same gate as `.husky/pre-push`: Biome (no writes), tsc, Jest, the
# tooling tests and the architecture rules, plus the slow tests
# (`*.slow.test.ts`) the pre-push gate skips: `make check-ci`, so the step
# list lives in the Makefile, not here. Visual-check and Maestro stay
# manual (they need a browser/simulator and pinned fonts).
name: check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make check-ci

  # Parallel to `check`, not part of `make check-ci`: it runs a full production
  # `expo export` (about a minute) and scans the bundle for dev-only code.
  release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make release-check

  # Parallel to `check`, not part of `make check-ci`: Jest with coverage, failing
  # under the floors in package.json (`coverageThreshold`, which may only go up).
  # The coverage/ folder is gitignored and not uploaded.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make coverage
