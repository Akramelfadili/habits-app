# The same gate as `.husky/pre-push`: Biome (no writes), tsc, Jest, the
# tooling tests and the architecture rules. Visual-check and Maestro stay
# manual (they need a browser/simulator and pinned fonts).
name: check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make check
