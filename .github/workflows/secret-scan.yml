# Secret scan: gitleaks over the FULL git history, on every PR and push to
# master. The repo is public, so a leaked secret is visible to everyone.
# The release binary is pinned to a version and verified against a pinned
# SHA-256 (no third-party action, no license key). --redact keeps findings
# from printing the secret in the log. Config: .gitleaks.toml.
#
# To bump gitleaks: change GITLEAKS_VERSION and GITLEAKS_SHA256 together; the
# hash is in gitleaks_<version>_checksums.txt on the release page.
name: secret-scan

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .'
